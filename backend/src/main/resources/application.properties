spring.application.name=quiz-backend

# --- Database (MySQL) ---
# Database "quiz_db" is created automatically on first run.
# Set DB_USERNAME / DB_PASSWORD environment variables, or edit the defaults after the colon.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quiz_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Server ---
# 8081 so it does not clash with the Student Management app on 8080
server.port=${PORT:8081}
server.error.include-message=always

# --- CORS: URL(s) of the React app, comma separated ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
